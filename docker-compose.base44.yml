services:
  # One-shot: install deps, create tables, and seed the demo catalog.
  setup:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python seed.py"

  # Flask dev server with auto-reload, served on host port 3000.
  web:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - FLASK_APP=app:create_app
    depends_on:
      setup:
        condition: service_completed_successfully
    command: sh -c "pip install --no-cache-dir -r requirements.txt && flask run --host=0.0.0.0 --port=3000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
