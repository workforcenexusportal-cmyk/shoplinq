{% extends "base.html" %}
{% block title %}Sign in — ShopLinq{% endblock %}
{% block page_id %}login{% endblock %}

{% block content %}
<div class="auth-card card">
  <h1>Sign in</h1>
  <form method="post">
    <label>Email<input type="email" name="email" required placeholder="you@example.com"></label>
    <label>Password<input type="password" name="password" required placeholder="Your password"></label>
    <label class="checkbox-row"><input type="checkbox" name="remember" value="1"> Keep me signed in</label>
    <button type="submit" class="btn btn-primary btn-block">Sign in</button>
  </form>
  <p class="muted center">New to ShopLinq? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
  <p class="center"><a class="link-muted" href="{{ url_for('auth.forgot_password') }}">Forgot your password?</a></p>
</div>
{% endblock %}
