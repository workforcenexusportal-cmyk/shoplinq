{% extends "base.html" %}
{% block title %}Reset your password — ShopLinq{% endblock %}
{% block page_id %}forgot{% endblock %}

{% block content %}
<div class="auth-card card">
  <h1>Forgot your password?</h1>
  <p class="muted">Enter the email you use for ShopLinq and we'll send you a reset link.</p>
  <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Email<input type="email" name="email" required placeholder="you@example.com"></label>
    <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
  </form>
  <p class="center"><a class="link-muted" href="{{ url_for('auth.login') }}">Back to sign in</a></p>
</div>
{% endblock %}
