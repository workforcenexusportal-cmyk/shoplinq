{% extends "base.html" %}
{% block title %}Choose a new password — ShopLinq{% endblock %}
{% block page_id %}reset{% endblock %}

{% block content %}
<div class="auth-card card">
  <h1>Reset your password</h1>
  <form method="post">
    <label>New password<input type="password" name="password" required minlength="8" placeholder="At least 8 characters"></label>
    <label>Confirm new password<input type="password" name="confirm" required placeholder="Repeat your password"></label>
    <button type="submit" class="btn btn-primary btn-block">Set new password</button>
  </form>
</div>
{% endblock %}
